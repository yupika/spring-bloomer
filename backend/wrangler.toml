name = "spring-bloomer-api"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Set after `wrangler d1 create spring-bloomer` — paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "spring-bloomer"
database_id = "REPLACE_WITH_DATABASE_ID"

# Origins allowed to POST logs. Add localhost for dev work.
[vars]
ALLOWED_ORIGINS = "https://bloom.dilettantegames.net,http://localhost:8000,http://127.0.0.1:8000"
