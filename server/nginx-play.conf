# Nginx vhost for play.dilettantegames.net
# Place at: /etc/nginx/sites-available/play.dilettantegames.net
# Symlink:  /etc/nginx/sites-enabled/play.dilettantegames.net
#
# After installing, run `sudo certbot --nginx -d play.dilettantegames.net`
# and certbot will inject the SSL listener and redirect rules.

# WebSocket upgrade map (place in http {} block via /etc/nginx/conf.d/ if not already global)
# This only needs to exist once globally; if your server already defines it, omit this map block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name play.dilettantegames.net;

    # Allow Let's Encrypt http-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ---------- Spring Bloomer ----------
    # Bun process listens on 127.0.0.1:3000 and serves the path prefix
    # /spring-bloomer/ (set by PATH_PREFIX env in the systemd unit).
    location /spring-bloomer/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-lived idle WS (1h)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- Future games ----------
    # Add more `location /<game>/ { proxy_pass http://127.0.0.1:<port>; ... }`
    # blocks here as new games come online.

    # Default: simple landing
    location = / {
        return 200 "play.dilettantegames.net is alive\n";
        add_header Content-Type text/plain;
    }
}
